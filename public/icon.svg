<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a6e"/>
      <stop offset="100%" style="stop-color:#0f1f40"/>
    </linearGradient>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- 背景（丸角四角） -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- カレンダー本体 -->
  <rect x="160" y="200" width="580" height="500" rx="40" ry="40"
        fill="none" stroke="white" stroke-width="28" opacity="0.9"/>
  <!-- カレンダーヘッダー帯 -->
  <rect x="160" y="200" width="580" height="110" rx="40" ry="40"
        fill="white" opacity="0.12"/>
  <rect x="160" y="270" width="580" height="40" fill="white" opacity="0.12"/>

  <!-- リング左 -->
  <rect x="310" y="155" width="36" height="90" rx="18" ry="18" fill="white" opacity="0.9"/>
  <!-- リング右 -->
  <rect x="554" y="155" width="36" height="90" rx="18" ry="18" fill="white" opacity="0.9"/>

  <!-- カレンダー区切り線（横） -->
  <line x1="160" y1="310" x2="740" y2="310" stroke="white" stroke-width="5" opacity="0.25"/>

  <!-- グリッド上段：3マス（色付き） -->
  <!-- マス1 ライトブルー -->
  <rect x="198" y="340" width="140" height="120" rx="20" ry="20" fill="#8ab4f8" opacity="0.85"/>
  <!-- マス2 ブルー -->
  <rect x="370" y="340" width="140" height="120" rx="20" ry="20" fill="#4285f4" opacity="0.95"/>
  <!-- マス3 パープル -->
  <rect x="542" y="340" width="140" height="120" rx="20" ry="20" fill="#7c4dff" opacity="0.9"/>
  <!-- パープルのマスの折れ角 -->
  <path d="M642,340 L682,340 L682,380 Z" fill="#ffffff" opacity="0.2"/>

  <!-- グリッド下段：2マス（暗め） -->
  <!-- マス4 -->
  <rect x="198" y="490" width="140" height="100" rx="20" ry="20" fill="#2a4a8a" opacity="0.7"/>
  <!-- マス5 -->
  <rect x="370" y="490" width="140" height="100" rx="20" ry="20" fill="#2a4a8a" opacity="0.7"/>

  <!-- 時計サークル（白背景） -->
  <circle cx="720" cy="660" r="140" fill="#0f1f40"/>
  <circle cx="720" cy="660" r="140" fill="none" stroke="white" stroke-width="28" opacity="0.9"/>
  <!-- 時計の針（3時方向） -->
  <line x1="720" y1="660" x2="720" y2="590" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <line x1="720" y1="660" x2="790" y2="660" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- 時計中心点 -->
  <circle cx="720" cy="660" r="16" fill="white"/>
</svg>
